[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "orpheusgraph"
version = "0.1.0"
description = "Rust knowledge graph traversal engine with Python bindings"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
readme = "README.md"

[tool.maturin]
# The bindings live behind the crate's `python` feature (which enables the
# optional pyo3 dep, itself declaring "extension-module"). Naming
# `pyo3/extension-module` here would pull PyO3 in but leave `python` off, so
# pybridge and the #[pymodule] entry point would be cfg'd out and the wheel
# would ship no PyInit_orpheusgraph.
features = ["python"]
