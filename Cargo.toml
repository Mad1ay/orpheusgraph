[package]
name = "orpheusgraph"
version = "0.1.0"
edition = "2021"
description = "Rust knowledge graph traversal engine with Python bindings"
license-file = "LICENSE.md"
repository = "https://github.com/Mad1ay/orpheusgraph"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.8"
pyo3 = { version = "0.23", features = ["extension-module"] }
rkyv = { version = "0.8", features = ["bytecheck"] }
bytecheck = "0.8"
indexmap = "2"

# ---- persistence (Phase 2a) ----
# Lock-free single-writer/multi-reader GraphState publisher (§3.5): load_full()
# hands readers a consistent immutable (base,delta,seq) with no reader-side lock.
arc-swap = "1"
# Frame crc over len‖payload and snapshot crc32 (§4.1/§4.2). SIMD, tiny, no_std.
crc32fast = "1"
# WAL payload encoder (spec-mandated): serde-based (no new derives), varint-compact,
# self-delimiting, stable append-only format. to_stdvec needs the "use-std" feature.
postcard = { version = "1", features = ["use-std"] }
# Advisory exclusive flock on LOCK for cross-process single-writer (§4.1); the
# kernel releases it on crash, so there is no stale-lock dance.
fs2 = "0.4"
# 16 random bytes for the u128 epoch on create + every timeline-forking recovery (§4.3).
getrandom = "0.2"
# ---- persistence (Phase 2b) ----
# The CSR snapshot base (V2: CSR + persisted name index) is mapped read-only
# for zero-copy larger-than-RAM traversal (OS paging keeps only the hot
# neighborhood resident) and for warm
# start without deserialization. memmap2 is the de-facto safe Mmap wrapper, works
# on Linux and Windows (needed for the GC/SIGBUS platform notes), and exposes
# `advise(Advice::WillNeed)` for the `prefault` madvise knob (§4.5). Its Mmap
# keeps the mapped region at an address independent of the handle's location,
# which is what makes the self-referential ArchivedCsrView pointer move-safe.
# Persist-only; cross-platform, so kept unconditional (not target-gated).
memmap2 = "0.9"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
jemallocator = "0.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
# On-disk temp dirs for the persistence tests (already a proptest transitive dep;
# declared explicitly here since the persist tests depend on it directly).
tempfile = "3"

[[bench]]
name = "bench_traversal"
harness = false

[[bench]]
name = "bench_persist"
harness = false

[profile.release]
lto = true
